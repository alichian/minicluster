#cloud-config
hostname: tinyvm
users:
  - name: debian
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - ${mysshkey}
    chpasswd:
      expire: false
      users:
        - name: debian
          password: debian
          type: text
    ssh_pwauth: false
