#cloud-config
hostname: ${myname}
users:
  - name: debian
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - ${mysshkey}
    chpasswd:
      expire: false
      users:
        - name: debian
          password: debian
          type: text
    ssh_pwauth: false
package_upgrade: true
packages:
  - curl
runcmd:
%{ if role == "server" }
  - [ "sh", "-c", "curl -sfL https://get.k3s.io | K3S_TOKEN=${k3stoken} sh -s - "]
%{ else }
  - [ "sh", "-c", "curl -sfL https://get.k3s.io | K3S_URL=https://${planner_IP}:6443 K3S_TOKEN=${k3stoken} sh -s - "]
%{ endif }
